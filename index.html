<style>
html,body{direction:rtl}
*{margin:0;padding:0;box-sizing:border-box}
html{direction:rtl}
body{
  min-height:100dvh; display:grid; place-items:center; padding:24px;
  background:linear-gradient(160deg,#0a4d4e,#0e6f70 55%,#127f6a);
  color:#fff; font-family:"Heebo","Assistant",system-ui,sans-serif;
}
.box{
  width:100%; max-width:390px; text-align:center;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.20);
  border-radius:18px; padding:34px 26px;
  backdrop-filter:blur(6px);
}
h1{font-size:25px; font-weight:900; letter-spacing:-.01em}
.sub{font-size:14.5px; opacity:.82; margin-top:8px; line-height:1.55}
form{margin-top:22px; display:grid; gap:10px}
input{
  font:inherit; font-size:18px; font-weight:600; text-align:center; letter-spacing:.12em;
  padding:13px 14px; border-radius:11px; color:#fff; direction:ltr;
  background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.28);
}
input::placeholder{color:rgba(255,255,255,.55); font-weight:400; letter-spacing:0; direction:rtl}
input:focus{outline:2px solid rgba(255,255,255,.6); outline-offset:1px}
button{
  font:inherit; font-size:15.5px; font-weight:700; cursor:pointer;
  padding:13px 14px; border-radius:11px; border:0; background:#fff; color:#0a4d4e;
}
button:hover{background:#f0f6f5}
button[disabled]{opacity:.6; cursor:default}
.msg{min-height:20px; font-size:13.5px; margin-top:12px; opacity:.9}
.msg.bad{color:#ffd0c4}
label.rem{display:flex; gap:8px; align-items:center; justify-content:center;
  font-size:13px; opacity:.85; margin-top:2px; cursor:pointer}
label.rem input{width:16px; height:16px; padding:0; letter-spacing:0}
.foot{margin-top:20px; font-size:11.5px; opacity:.6; line-height:1.6}
</style>
</head>

<div class="box">
  <h1>תאילנד · אפריל–מאי 2027</h1>
  <div class="sub">הדף נעול. הזינו תעודת זהות מאושרת כדי לפתוח אותו.</div>
  <form id="f">
    <input id="c" type="password" inputmode="numeric" autocomplete="off"

    <button id="b" type="submit">פתיחה</button>
  </form>

</div>

<script>
(function(){
  "use strict";
  var P = JSON.parse(document.getElementById("p").textContent);
  var KEY = "thai2027.id";
  var m = document.getElementById("m");
  var b = document.getElementById("b");

  function b2a(b64){
    var s = atob(b64), u = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }

  // אותה נורמליזציה כמו בצד שבנה את הקובץ: ספרות בלבד, מרופד ל-9.
  function norm(v){
    var d = String(v).replace(/\D+/g, "");
    while (d.length < 9 && d.length > 0) d = "0" + d;
    return d;
  }

  function unwrap(idnum){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(idnum), "PBKDF2", false, ["deriveKey"])
      .then(function(base){
        // גזירה אחת בלבד — כל העטיפות חולקות מלח, ולכן ריבוי מורשים לא מאט.
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:b2a(P.salt), iterations:P.it, hash:"SHA-256" },
          base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      })
      .then(function(k){
        var i = 0;
        function next(){
          if (i >= P.k.length) return Promise.reject(new Error("no match"));
          var w = P.k[i++];
          return crypto.subtle.decrypt({ name:"AES-GCM", iv:b2a(w.iv) }, k, b2a(w.ct))
            .catch(next);
        }
        return next();
      });
  }

  function open_(idnum){
    return unwrap(idnum)
      .then(function(masterRaw){
        return crypto.subtle.importKey("raw", masterRaw, { name:"AES-GCM" }, false, ["decrypt"]);
      })
      .then(function(mk){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:b2a(P.iv) }, mk, b2a(P.ct));
      })
      .then(function(buf){
        if (!P.gz) return new TextDecoder("utf-8").decode(buf);
        if (typeof DecompressionStream === "undefined")
          throw new Error("הדפדפן הזה ישן מדי");
        var ds = new DecompressionStream("gzip");
        return new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
      });
  }

  function show(html){
    document.open();
    document.write(html);
    document.close();
  }

  function attempt(idnum, remember, quiet){
    b.disabled = true;
    m.className = "msg";
    m.textContent = "פותח…";
    return open_(idnum).then(function(html){
      if (remember) { try { localStorage.setItem(KEY, idnum); } catch(e){} }
      show(html);
    }).catch(function(){
      try { localStorage.removeItem(KEY); } catch(e){}
      b.disabled = false;
      if (quiet) { m.textContent = ""; return; }
      m.className = "msg bad";
      m.textContent = "תעודת הזהות הזו לא מאושרת.";
      document.getElementById("c").select();
    });
  }

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var v = norm(document.getElementById("c").value);
    if (!v) return;
    attempt(v, document.getElementById("r").checked, false);
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) attempt(saved, true, true);
})();
</script>
